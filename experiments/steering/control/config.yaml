# Central steering matched control. The Stage 1 policy receives the same fixed extra training
# budget as the stand-still group, with no behavior change. This separates ordinary continued
# training from the stand-still action's effect.
name: central-steering-control
change: fixed-budget continuation of Stage 1 (matched control; no behavior change)
base: configs/copush-light-box.yaml
reference: configs/overnight.yaml
warm_start: runs/stage1-random-box-pose/model.zip
out: runs/steering/control-s1
results: experiments/steering/control/results
test_set: experiments/test_sets/stage1_large.json
check_set: experiments/test_sets/stage1_checks.json

overrides:
  controller: {mode: central}
  reward: {version: v1.1}
  rl: {eval_every: 20000}
  env:
    box_start: {enabled: true, dx: 0.15, dy: 0.15, dyaw: 45.0}
    stand_still: {enabled: false, vx_threshold: 0.02}

steps: 1000000
checkpoint_every: 100000
max_videos: 12

widen:
  levels: [1.0]
  threshold: 0.70
  eval_every: 100000
  episodes: 50
  seed0: 10050

early_stop: {success: 0.80, evals: 0}
