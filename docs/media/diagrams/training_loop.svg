<rect x="682.61" y="528.15" width="64.78" height="43.7" rx="21.85" fill="#FBE3DC" stroke="#D85A30" stroke-width="2"/><text x="715" y="558.28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#993C1D">−10</text>
