<g transform="translate(184,446) scale(1.25)"><circle r="26" fill="#FFFFFF" stroke="#534AB7" stroke-width="2"/><path d="M-17,10 A20,20 0 1 1 17,10" fill="none" stroke="#B9B4F0" stroke-width="5" stroke-linecap="round"/><path d="M0,2 L12,-12" stroke="#D85A30" stroke-width="3" stroke-linecap="round"/><circle r="4" fill="#534AB7"/></g><g transform="translate(250,452) scale(1.1)"><g transform="rotate(-40)"><rect x="-5" y="-4" width="10" height="36" rx="5" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.8"/><circle cx="0" cy="-12" r="12" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.8"/><rect x="-5" y="-30" width="10" height="16" fill="#E3EEFC"/><path d="M-5,-24 L-5,-14 M5,-24 L5,-14" stroke="#185FA5" stroke-width="1.8" stroke-linecap="round"/></g></g>
<text x="210" y="523" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#412402">PPO nudges the weights</text><text x="210" y="574" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#633806">do more of what scored well</text>
<circle cx="76" cy="396" r="15" fill="#534AB7"/><text x="76" y="402" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">4</text>
<rect x="470" y="370" width="150" height="250" rx="16" fill="#FFF8EC" stroke="#BA7517" stroke-width="1.5"/>
<circle cx="494" cy="394" r="15" fill="#534AB7"/><text x="494" y="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">3</text>
<text x="545" y="448" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#412402">Reward</text>
