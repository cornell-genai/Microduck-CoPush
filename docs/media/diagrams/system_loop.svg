<svg xmlns="http://www.w3.org/2000/svg" width="1324" height="384" viewBox="0 0 1324 384" role="img"><title>How it works: what the ducks see goes to the coordinator network, which picks speed and turn; frozen walking and pushing policies move the ducks in the simulator; the simulator gives a reward (plus 10 for the box in the target) or a penalty (minus 10 when a duck falls); a PPO update then changes the coordinator's weights</title>
