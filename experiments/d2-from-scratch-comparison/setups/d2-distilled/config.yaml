# D2 distilled: D2 started from the copy of the centralized stage 1 policy (init: distilled). The only
# difference from d2-scratch. Seed 1 is runs/decentral-p1-d2 (same settings, evals every 10k simulator steps).
#
#   scripts/rl.sh scripts/rl/stage.py --config experiments/d2-from-scratch-comparison/setups/d2-distilled/config.yaml --seed N
#
# Resolved config = base < reference block of `reference` (01_reference: reward v1.1, layout overnight,
# seed 1, fixed in-contact start) < overrides. Each duck runs the shared policy on its own view plus the
# partner (copush.decentral). Steps count duck entries: 2 per simulator step.
name: d2-distilled
change: decentralized, own view + partner (D2), PPO from the distilled weights, fixed start
base: configs/copush.yaml
reference: configs/overnight.yaml
init: distilled
warm_start: runs/decentral-distill/d2.zip   # distilled from the centralized stage 1 policy
out: runs/d2-from-scratch/d2-distilled-s2   # --seed N -> d2-distilled-sN; seed 1 is an existing run (runs.yaml)
results: experiments/d2-from-scratch-comparison/setups/d2-distilled/results
test_set: experiments/test_sets/stage1.json

overrides:
  controller: {mode: decentral, include_partner: true}
  rl: {eval_every: 50000}                 # duck entries = an eval every 25k simulator steps

steps: 800000                             # duck entries = 400k simulator steps, as 01_reference
checkpoint_every: 200000
max_videos: 12

widen:                                    # fixed start: no range; the checks just log fixed-start success
  levels: [1.0]
  threshold: 0.70
  eval_every: 50000
  episodes: 3
  seed0: 10001

early_stop: {success: 0.80, evals: 0}     # never: always the full 400k simulator steps
