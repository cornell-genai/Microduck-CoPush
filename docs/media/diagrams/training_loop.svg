<text x="545" y="598" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#633806" font-style="italic">box in the target</text>
<rect x="640" y="370" width="150" height="250" rx="16" fill="#FFF8EC" stroke="#BA7517" stroke-width="1.5"/>
<circle cx="664" cy="394" r="15" fill="#534AB7"/><text x="664" y="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">3</text>
<text x="715" y="448" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#412402">Penalty</text>
