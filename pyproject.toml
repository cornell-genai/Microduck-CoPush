[project]
name = "copush"
version = "0.1.0"
description = "Two MicroDucks cooperatively pushing a box in MuJoCo (client of Pollen's microduck / microduck_rl)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["copush"]

[tool.pytest.ini_options]
testpaths = ["tests"]
