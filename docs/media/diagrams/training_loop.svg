<svg xmlns="http://www.w3.org/2000/svg" width="840" height="710" viewBox="0 0 840 710" role="img"><title>The training loop: the network picks speed and turn, the ducks try it in the simulator, the result is either a reward (plus 10 for the box in the target) or a penalty (minus 10 when a duck falls), and PPO nudges the weights; then it repeats</title>
