# Two-duck CoPush sim (copush/sim.py, scripts/copush.sh).
# World frame: x forward (duck A's spawn heading at yaw 0), y left, metres; yaw in DEGREES.
# Flags override anything here, e.g.
#   scripts/copush.sh --duck-a 0,0.1,0 --box 0.4,0,90 --target 1.2,0,90 --box-mass 0.2

duck_a:
  x: 0.0
  y: 0.10
  yaw: 0
  policy: velstand          # velstand | shoepush (the policy at reset)
duck_b:
  x: 0.0
  y: -0.10
  yaw: 0
  policy: velstand

box:                        # 28 x 10 x 9 cm, free joint (the Shoe Push box)
  x: 0.35
  y: 0.0
  yaw: 90                   # 90 = long 28 cm face toward ducks that face +x
  mass: 0.15                # kg

target:                     # flat, visual only (no collision)
  x: 1.20
  y: 0.0
  yaw: 90
  size: [0.40, 0.20]        # length x width (m) along the target's own x / y, like the box's 28 x 10

policies:                   # paths relative to the repo root (scripts/fetch_policies.sh)
  velstand: data/policies/velstand_v8/velstand.onnx
  shoepush: data/policies/robert/shoe_push/forward/policy.onnx

keyboard:                   # terminal keys in --viewer mode
  vx_step: 0.05             # m/s per W/S (I/K) press
  vyaw_step: 0.3            # rad/s per A/D (J/L) press
  vx_max: 0.3
  vx_min: -0.3
  vyaw_max: 1.5

actuator:                   # BAM XL330 model, as the B0 harness
  vin: 7.4                  # battery voltage (V)
  vin_drop_gain: 0.1        # load-dependent sag

env:                        # RL environment (copush/env.py)
  layout: close             # a name from `layouts` below: start mode + target for RL
  settle_s: 0.3             # in_contact start: stand still on velstand this long, then Shoe Push
  contact_setback: 0.095    # in_contact start: trunk centre this far behind the box centre
  contact_spacing: 0.20     # in_contact start: distance between the two ducks
  step_s: 0.2               # one env step = 10 control steps
  max_steps: 100            # 20 s episodes
  lose_contact_s: 0.5       # Shoe Push -> velstand after this long without box contact
  stand_still:              # OFF: lets the learner stand a duck still (the scripts use set_hold)
    enabled: false          # true: commanded vx < vx_threshold -> that duck on velstand at zero speed
    vx_threshold: 0.02      # m/s; action vx < -0.87 (vx = 0.15 (a + 1))
  randomize: false          # true: sample the box per episode from `random` (train seeds only)
  random:
    box_x: [0.30, 0.36]     # keeps the box < 0.40 m from a duck at the start (else "lost")
    box_y: [-0.04, 0.04]
    box_yaw: [75, 105]      # deg
    box_mass: [0.10, 0.25]  # kg
  box_start:                # OFF: box pose offset from box.x / box.y / box.yaw per episode (train seeds),
    enabled: false          #   ducks still placed in contact with its long face; mass stays box.mass
    dx: 0.10                # m, +- along world x (toward the target ahead)
    dy: 0.10                # m, +- along world y (> 0 = left, away from a target on the right)
    dyaw: 30.0              # deg, +- box yaw relative to its nominal yaw (= the target's yaw)
    scale: 1.0              # fraction of the range above in use (auto-widen: set_box_range)
    hard_frac: 0.0          # > 0: this fraction of starts has yaw offset in [hard_min_dyaw, dyaw] (the
    hard_min_dyaw: 15.0     #   long-turn side), the rest in [-dyaw, hard_min_dyaw); both scaled by scale
  heldout_seeds: [10000, 10099]   # inclusive; evaluation only, refused in split="train"
  curriculum:               # OFF: target moves further / sideways as eval success grows
    enabled: false
    distances: [0.40, 0.60, 0.85]   # box start -> target along the push line, per level (m)
    offsets: [0.0, 0.10, 0.20]      # sideways target offset per level (m)
    success_threshold: 0.8          # eval success rate that unlocks the next level
    eval_episodes: 5

layouts:                    # env.layout picks one
  close:                    # starts pushing; target 0.40 m straight ahead of the box
    start_mode: in_contact  # in_contact | approach
    target: {x: 0.75, y: 0.0, yaw: 90}
  steer:                    # like close, but the target is 0.30 m to the right (against Shoe Push's
    start_mode: in_contact  #   left drift): beyond the target's own +-0.20 m, so a straight push misses
    target: {x: 0.75, y: -0.30, yaw: 90}
  hard:                     # the original scene: walk up from 0.35 m, target 0.85 m away
    start_mode: approach
    target: {x: 1.20, y: 0.0, yaw: 90}

reward:                     # copush.rewards.TaskReward: the values below are v1;
  version: v1.1             # reward_versions[version] is applied on top of them
  w_pos: 10.0               # x metres of box progress toward the target
  w_yaw: 3.0                # x radians of yaw-error progress (error modulo 180 deg)
  success_bonus: 10.0
  success_yaw_deg: 15.0     # success: centre inside the target, yaw error <= this,
  success_hold_s: 1.0       #   both ducks up, held this long -> bonus and episode ends
  time_penalty: 0.01        # per env step
  fall_mode: terminate      # terminate (v1): -fall_penalty, episode ends
                            # continuous (v2): episode goes on, -fall_rate per second any duck is down
  fall_penalty: 10.0
  fall_min_down_s: 0.0      # a fall counts once a duck has been down this long without a break
  fall_rate: 1.0
  box_fail_penalty: 5.0     # box tipped or lost: episode ends
  box_tilt_deg: 30.0
  box_lost_dist: 0.40       # box centre this far from BOTH trunks
  cooperation_mode: none    # none (v1) | gated_balanced (v2):
                            #   + coop_lambda * max(0, progress) * min(F_A, F_B) / max(F_A, F_B)
  coop_lambda: 5.0
  contact_penalty: 0.0      # per duck per step, when off the box > contact_off_s (not while inside)
  contact_off_s: 0.3

reward_versions:            # docs/REWARD_LOG.md says why each one exists
  v1: {}
  v1.1: {fall_min_down_s: 0.2, w_yaw: 1.0, box_fail_penalty: 10.0, time_penalty: 0.03}
  v1.2: {fall_min_down_s: 0.2, w_yaw: 1.0, box_fail_penalty: 10.0, time_penalty: 0.03,
         contact_penalty: 0.02}
  v1.3: {fall_min_down_s: 0.2, w_yaw: 1.0, box_fail_penalty: 10.0, time_penalty: 0.01}   # v1.1, lower time penalty

video:                      # copush.video: episode videos (runs/<run_id>/videos/)
  width: 480
  height: 270
  fps: 25
  speedup: 2                # 20 s episode -> 10 s video

rl:                         # copush.rl_callbacks.VideoEvalCallback (PPO, later)
  eval_every: 10000         # training steps between evaluation episodes
  eval_seed: 10000          # a held-out seed (env.heldout_seeds)
  improve_margin: 2.0       # save an "improved" video when eval return beats the best by this

ppo:                        # scripts/rl/train.py (stable-baselines3 PPO)
  n_envs: 8
  total_steps: 300000
  n_steps: 256              # per env per update (8 x 256 = 2048)
  batch_size: 256
  n_epochs: 10
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  seed: 0
