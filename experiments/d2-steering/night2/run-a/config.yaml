# D2 steering, night 2, Run A (stand-still). Same as last night's Run A with a FIXED budget: 2,000,000 duck steps, NO early stopping
# (the 50-start check set is still evaluated every checkpoint, for the log only), and the training seed set by the
# overnight script (--seed 1 or 2, which also names the run folder: a-s1, a-s2).
#
#   scripts/rl.sh scripts/rl/stage.py --config experiments/d2-steering/night2/run-a/config.yaml --seed 1
#
#
#   scripts/rl.sh scripts/rl/stage.py --config experiments/d2-steering/night2/run-a/config.yaml
#   (scripts/rl/overnight_steering.py runs it, then evaluates it)
#
# D2 phase 2 (experiments/decentralized-control/p2-d2) with env.stand_still turned on: a duck whose commanded forward
# speed is below the threshold (0.02 m/s, the lowest few percent of its speed range) is held on velstand at zero speed
# with no turning, so it can truly hold while its partner pushes; it comes back to automatic walk/push switching when
# it commands more. The only change is that setting. Warm start from the trained D2 stage 1 policy, stage 1's random
# box starts, reward v1.1, the same budget as D2 phase 2 (2,000,000 duck steps = 1M simulator steps, 2 per sim step),
# early stopping on the stage 1 check set. Question: can two independent ducks learn to pivot the box (one holds, the
# other pushes) on long-turn starts?
name: d2-steering-night2-run-a
change: stand-still action on D2 (env.stand_still), warm start from D2 stage 1, random box starts (stage 1 range)
base: configs/copush-light-box.yaml
reference: configs/overnight.yaml
warm_start: runs/decentral-p2-d2/model.zip            # D2 stage 1 (policies-v1 release, stage1-d2): 66% on stage1_large, 15% on > +15 deg
out: runs/d2-steering/night2/a-s1
results: experiments/d2-steering/night2/run-a/results
test_set: experiments/test_sets/stage1_large.json
check_set: experiments/test_sets/stage1_checks.json

overrides:
  controller: {mode: decentral, include_partner: true}
  rl: {eval_every: 20000}
  env:
    box_start: {enabled: true, dx: 0.15, dy: 0.15, dyaw: 45.0}   # stage 1's range
    stand_still: {enabled: true, vx_threshold: 0.02}              # THE change

steps: 2000000                            # duck entries = 1M simulator steps, always the full budget
checkpoint_every: 200000
max_videos: 12

widen:                                    # no widening (full range); checks on the fixed check set
  levels: [1.0]
  threshold: 0.70
  eval_every: 200000                      # duck entries: the check set every checkpoint (logging only)
  episodes: 50
  seed0: 10050

early_stop: {success: 0.80, evals: 0}     # evals: 0 = NEVER stop early: always the full 2M duck steps
