<text x="210" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#412402">The network picks</text><text x="210" y="206.25" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#412402">speed and turn</text><text x="210" y="236" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#633806">random weights at first,</text><text x="210" y="255.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#633806">or a copy of a trained one</text>
<circle cx="76" cy="66" r="15" fill="#534AB7"/><text x="76" y="72" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">1</text>
<rect x="470" y="40" width="320" height="250" rx="16" fill="#FFF8EC" stroke="#BA7517" stroke-width="1.5"/>
<path d="M559,89 L715,89 L701,155 L545,155 Z" fill="#D5E6F8" stroke="#8DB5E0" stroke-width="1.5" stroke-linejoin="round"/><g transform="translate(596,112) scale(0.62,0.62)"><path d="M-12,15 L-12,26 M4,15 L4,26" stroke="#D85A30" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="22" ry="16" fill="#FAC775" stroke="#854F0B" stroke-width="1.5"/><path d="M-10,-2 Q0,8 10,-2" fill="none" stroke="#854F0B" stroke-width="1.2"/><circle cx="16" cy="-18" r="11" fill="#FAC775" stroke="#854F0B" stroke-width="1.5"/><polygon points="26,-20 37,-16 26,-12" fill="#D85A30" stroke="#993C1D" stroke-width="1" stroke-linejoin="round"/><circle cx="19" cy="-21" r="2" fill="#2C2C2A"/><line x1="14" y1="-29" x2="12" y2="-36" stroke="#854F0B" stroke-width="1.5"/><circle cx="12" cy="-37" r="2.2" fill="#D85A30"/></g><g transform="translate(626,120) scale(0.62,0.62)"><path d="M-12,15 L-12,26 M4,15 L4,26" stroke="#D85A30" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="22" ry="16" fill="#FAC775" stroke="#854F0B" stroke-width="1.5"/><path d="M-10,-2 Q0,8 10,-2" fill="none" stroke="#854F0B" stroke-width="1.2"/><circle cx="16" cy="-18" r="11" fill="#FAC775" stroke="#854F0B" stroke-width="1.5"/><polygon points="26,-20 37,-16 26,-12" fill="#D85A30" stroke="#993C1D" stroke-width="1" stroke-linejoin="round"/><circle cx="19" cy="-21" r="2" fill="#2C2C2A"/><line x1="14" y1="-29" x2="12" y2="-36" stroke="#854F0B" stroke-width="1.5"/><circle cx="12" cy="-37" r="2.2" fill="#D85A30"/></g><g transform="translate(664,122) scale(0.9)"><rect x="-20" y="-9" width="40" height="18" rx="3" fill="#E8A36B" stroke="#9B5A22" stroke-width="1.5"/><line x1="-20" y1="-2" x2="20" y2="-2" stroke="#9B5A22" stroke-width="1"/></g><g transform="translate(692,140) scale(1)"><path d="M-22,6 L-14,-6 L22,-6 L14,6 Z" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1.5" stroke-linejoin="round"/></g>
<text x="630" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#412402">The ducks try it</text><text x="630" y="206.25" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#412402">in the simulator</text><text x="630" y="236" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#633806">up to 100 steps</text><text x="630" y="255.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#633806">per try</text>
<circle cx="496" cy="66" r="15" fill="#534AB7"/><text x="496" y="72" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">2</text>
